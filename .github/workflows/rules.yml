name: Publish Firestore rules

# Publishes firestore.rules whenever it changes on main (or by hand from the Actions tab).
on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Publish rules
        run: node scripts/deploy-rules.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
