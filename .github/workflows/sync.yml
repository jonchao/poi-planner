name: Sync from Wanderlog

# Pulls each trip in the WANDERLOG_TRIPS secret every hour (and on demand from the Actions tab),
# then commits data/*.json if anything changed. GitHub Pages redeploys on the commit.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull trips from Wanderlog
        run: node scripts/sync-wanderlog.mjs
        env:
          WANDERLOG_TRIPS: ${{ secrets.WANDERLOG_TRIPS }}
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Sync from Wanderlog"
          git push
