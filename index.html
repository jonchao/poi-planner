<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>POI Planner</title>
<script>try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<script src="app-switcher.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Two screens.
   Trips (planners, signed in with Google): a grid of trip cards with their Wanderlog cover photo, a New trip button,
   and the co-planner list.
   A trip (anyone with its link): a hero header with the destination photo and trip details, then two columns:
   the main column (sticky bar with tabs + list filters, then the view) and a sticky summary side panel with
   whole-trip totals. Below 1100px the summary becomes a slide-over panel opened from the bar.
   Views: "All spots" is one card per place (photo, short description, your 1-5 rating, everyone's scores),
   "Group picks" ranks places into tiers, "Reservations" lists what still needs booking, "Itinerary" is Wanderlog's day-by-day plan, "Map" pins every place. */
:root {
  --bg: #f7f3ec;
  --surface: #fffdf9;
  --surface-2: #f1ebe1;
  --line: #e6ddcf;
  --ink: #201b16;
  --muted: #6f665b;
  --accent: #c2410c;
  --accent-soft: #fdebdc;
  --rosa: #b8125a;
  --rosa-soft: #fde4ef;
  --ok: #1d7a46;
  --ok-soft: #e1f3e8;
  --warn: #8a5300;
  --warn-soft: #fdf0d3;
  --hot: #b42318;
  --hot-soft: #fde6e3;
  /* 1-5 score scale, light to deep marigold */
  --s1: #ece4d8; --s1-fg: #5f574c;
  --s2: #f8dfb8; --s2-fg: #5c3d00;
  --s3: #f5bf6a; --s3-fg: #3d2800;
  --s4: #ea8a1f; --s4-fg: #241400;
  --s5: #c2410c; --s5-fg: #ffffff;
  /* Group verdict, an ordered scale: rosa steps for the "go" tiers, neutrals for skip / not enough votes */
  --v-must: #6d0a36; --v-def: #b8125a; --v-prob: #e0679a; --v-maybe: #f3b9d1; --v-skip: #b3aa9e; --v-wait: #e6ddcf;
  --star: #d97706;
  --shadow: 0 1px 2px rgba(32,27,22,.05), 0 6px 20px rgba(32,27,22,.05);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Fraunces", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120e; --surface: #1f1b16; --surface-2: #2a251f; --line: #3a332b; --ink: #f4eee5; --muted: #a99f92;
    --accent: #f59e4b; --accent-soft: #3b2616; --rosa: #ff7fb2; --rosa-soft: #3d1527;
    --ok: #63d394; --ok-soft: #173323; --warn: #f2bb55; --warn-soft: #3a2c10; --hot: #ff8f80; --hot-soft: #3d1a16;
    --s1: #2f2922; --s1-fg: #b3a99c; --s2: #4a3720; --s2-fg: #f3d9b0; --s3: #7a5212; --s3-fg: #ffe9c4;
    --s4: #c46f12; --s4-fg: #1a0f00; --s5: #f08a2c; --s5-fg: #1a0f00;
    --v-must: #ffc4dd; --v-def: #ff7fb2; --v-prob: #c4467d; --v-maybe: #6b2c48; --v-skip: #6f665b; --v-wait: #3a332b;
    --star: #fbbf24;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15120e; --surface: #1f1b16; --surface-2: #2a251f; --line: #3a332b; --ink: #f4eee5; --muted: #a99f92;
  --accent: #f59e4b; --accent-soft: #3b2616; --rosa: #ff7fb2; --rosa-soft: #3d1527;
  --ok: #63d394; --ok-soft: #173323; --warn: #f2bb55; --warn-soft: #3a2c10; --hot: #ff8f80; --hot-soft: #3d1a16;
  --s1: #2f2922; --s1-fg: #b3a99c; --s2: #4a3720; --s2-fg: #f3d9b0; --s3: #7a5212; --s3-fg: #ffe9c4;
  --s4: #c46f12; --s4-fg: #1a0f00; --s5: #f08a2c; --s5-fg: #1a0f00;
  --v-must: #ffc4dd; --v-def: #ff7fb2; --v-prob: #c4467d; --v-maybe: #6b2c48; --v-skip: #6f665b; --v-wait: #3a332b;
  --star: #fbbf24;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.shell { max-width: 1260px; margin: 0 auto; padding: 0 16px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 312px; gap: 0 32px; align-items: start; }
.col-main { min-width: 0; }

/* Shared header bits */
.titles { flex: 1; min-width: 0; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 2px 0 2px; font: 600 clamp(26px, 5vw, 40px)/1.1 var(--font-display); letter-spacing: -.01em; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.who { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
.who b { font-weight: 600; }
.who.empty { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }
app-switcher { color: var(--ink); --app-switcher-hover-bg: var(--surface-2); }
.link-btn { border: 0; background: none; padding: 0; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* Trip hero: the destination photo with the title and trip details over it */
.hero { position: relative; color: #fff; background: linear-gradient(135deg, #7c2d12, #9d174d) center / cover no-repeat; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,8,6,.45), rgba(10,8,6,.12) 35%, rgba(10,8,6,.78)); }
.hero-inner { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; min-height: 280px; padding-top: 14px; padding-bottom: 22px; }
.hero-top { display: flex; align-items: center; gap: 8px; }
.hero-top .spacer { flex: 1; }
.hero-back { display: inline-flex; align-items: center; gap: 6px; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 12px 6px 8px; border-radius: 999px; background: rgba(0,0,0,.32); backdrop-filter: blur(6px); }
.hero-back:hover { background: rgba(0,0,0,.5); }
.hero .who { background: rgba(0,0,0,.32); border-color: rgba(255,255,255,.35); color: #fff; backdrop-filter: blur(6px); }
.hero .who.empty { border-color: #fff; color: #fff; }
.hero .icon-btn, .hero app-switcher { color: #fff; --app-switcher-hover-bg: rgba(255,255,255,.18); }
.hero .icon-btn:hover { background: rgba(255,255,255,.18); }
.hero .eyebrow { color: #ffd7ae; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.hero h1 { text-shadow: 0 2px 16px rgba(0,0,0,.35); }
.hero .sub { color: rgba(255,255,255,.9); font-size: 14.5px; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.hero .sub .link-btn { color: #fff; }
.hero-credit { position: absolute; right: 12px; bottom: 6px; z-index: 1; font-size: 11px; color: rgba(255,255,255,.6); }

/* Sticky bar: tabs + filters */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs-row { display: flex; align-items: center; gap: 8px; }
.tabs { display: flex; gap: 4px; padding-top: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 12px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .short { display: none; }
.dash-btn { display: none; align-items: center; gap: 6px; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 600; }
.dash-btn svg { width: 16px; height: 16px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
.chips::-webkit-scrollbar { display: none; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; white-space: nowrap; }
.chip-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip-btn .n { opacity: .65; margin-left: 4px; }
.chip-btn.kind-chip { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tools select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 8px; font-size: 13.5px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.toggle input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

main { padding: 16px 0 40px; }
.banner { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--hot-soft); color: var(--hot); font-size: 14px; }
.intro { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.progress { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font-size: 14px; }
.progress .track { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; max-width: 260px; }
.progress .fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s ease; }
.list-head { margin: 26px 0 10px; display: flex; align-items: baseline; gap: 8px; font: 600 20px/1.2 var(--font-display); }
.list-head:first-child { margin-top: 0; }
.list-head .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; align-self: center; }
.list-head .n { font: 500 14px var(--font); color: var(--muted); }
.empty-note { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; }

/* Place card */
.cards { display: grid; gap: 12px; }
.spot {
  display: grid; grid-template-columns: 96px minmax(0, 1fr); grid-template-areas: "thumb info" "thumb scores";
  gap: 12px 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  scroll-margin-top: 130px;
}
.spot.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 40% { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); } }
.thumb { grid-area: thumb; width: 96px; height: 96px; border-radius: 10px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font: 600 28px var(--font-display); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.info { grid-area: info; min-width: 0; }
.name-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.name-row h3 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25; }
.badges { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.meta { margin: 3px 0 0; color: var(--muted); font-size: 13.5px; }
.blurb { margin: 6px 0 0; font-size: 14.5px; }
.note { margin: 6px 0 0; font-size: 13.5px; padding: 6px 10px; border-left: 3px solid var(--line); color: var(--muted); }
.sched { margin: 6px 0 0; font-size: 13.5px; color: var(--ok); font-weight: 500; }
.links { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 13.5px; }
.links a, .links button { text-decoration: none; font-weight: 500; }
.links a:hover { text-decoration: underline; }
.scores { grid-area: scores; display: grid; grid-template-columns: minmax(0, 1fr) minmax(130px, 200px); gap: 10px 20px; align-items: start; padding-top: 12px; border-top: 1px solid var(--line); }
.rate-legend { display: none; margin: 0; font-size: 12px; color: var(--muted); }
/* Everyone's scores for this place: one row per person, highest first, next to your rating buttons */
.group-col { display: grid; gap: 6px; min-width: 0; }
.group-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.votes-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.votes-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.votes-list .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.votes-list li.me .nm { font-weight: 700; }
.votes-list .sc { display: grid; place-items: center; flex: none; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.votes-list .sc.none { color: var(--muted); font-weight: 500; }
.votes-list.empty { color: var(--muted); font-size: 13px; }
.row-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.rate { display: grid; gap: 6px; }
.rate-btns { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; max-width: 420px; }
.rate-btn { display: grid; justify-items: center; gap: 0; padding: 6px 2px; min-height: 48px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; transition: background-color .12s ease, transform .12s ease; }
.rate-btn b { font-size: 17px; line-height: 1.1; }
.rate-btn span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.rate-btn:hover { border-color: var(--muted); }
.rate-btn:active { transform: scale(.96); }
.rate-btn[aria-pressed="true"] { border-color: transparent; }
.rate-btn[aria-pressed="true"] span { color: inherit; opacity: .85; }
/* Top 5: each person's must-gos (up to five, all equal) */
.top-btn { justify-self: start; display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; padding: 6px 12px 6px 9px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.top-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.top-btn:hover { border-color: var(--muted); color: var(--ink); }
.top-btn[aria-pressed="true"] { border-color: var(--star); color: var(--ink); background: var(--accent-soft); }
.top-btn[aria-pressed="true"] svg { fill: var(--star); stroke: var(--star); }
.top-btn.full { opacity: .55; }
.top-star { color: var(--star); margin-left: 4px; font-size: 12px; }
.top-line { color: var(--ink) !important; }
.top-line .top-star { margin: 0 4px 0 0; }
.avg { display: inline-flex; align-items: baseline; gap: 4px; }
.avg b { font-size: 20px; font-weight: 700; line-height: 1; }
.avg small { color: var(--muted); font-size: 12.5px; }
.people { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.person { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 999px; font-size: 13px; background: var(--surface-2); }
.person b { display: grid; place-items: center; min-width: 22px; height: 22px; border-radius: 999px; font-size: 12.5px; background: rgba(255,255,255,.35); }
.person.none { background: transparent; border: 1px dashed var(--line); color: var(--muted); padding: 2px 10px; }
.person.me { box-shadow: inset 0 0 0 1.5px var(--ink); }
.s1 { background: var(--s1); color: var(--s1-fg); } .s2 { background: var(--s2); color: var(--s2-fg); } .s3 { background: var(--s3); color: var(--s3-fg); }
.s4 { background: var(--s4); color: var(--s4-fg); } .s5 { background: var(--s5); color: var(--s5-fg); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.res-hi { background: var(--hot-soft); color: var(--hot); }
.res-mid { background: var(--warn-soft); color: var(--warn); }
.res-lo { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.booked-b { background: var(--ok-soft); color: var(--ok); }
.closed-b { background: var(--ink); color: var(--bg); }
.tier { display: inline-flex; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.t-must { background: var(--v-must); color: #fff; }
.t-must::before { content: "★ "; }
.t-def { background: var(--rosa); color: #fff; }
:root[data-theme="dark"] .t-def, :root[data-theme="dark"] .t-must { color: #1a0710; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .t-def, :root:not([data-theme="light"]) .t-must { color: #1a0710; } }
.t-prob { background: var(--rosa-soft); color: var(--rosa); }
.t-maybe { background: var(--surface-2); color: var(--ink); }
.t-skip { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.t-wait { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.split { font-size: 12.5px; color: var(--muted); }

/* Group picks */
.voted { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; padding: 0; list-style: none; }
.voted li { padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.voted li.done { border-color: var(--ok); color: var(--ok); }
.tier-sec { margin-top: 22px; }
.tier-head { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; }
.tier-head h2 { margin: 0; font: 600 20px/1.2 var(--font-display); }
.tier-head .n { color: var(--muted); font-size: 14px; }
.tier-head p { margin: 0 0 0 auto; color: var(--muted); font-size: 13px; text-align: right; }
.picks { display: grid; gap: 8px; }
.pick { display: grid; grid-template-columns: 26px 52px minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; padding: 10px 14px 10px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.rank { text-align: center; font-weight: 700; color: var(--muted); font-size: 14px; }
.pthumb { width: 52px; height: 52px; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pinfo { min-width: 0; display: grid; gap: 4px; }
.pname { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; font-size: 15.5px; }
.pname:hover { color: var(--accent); }
.pinfo .meta { margin: 0; }
.pscore { display: grid; justify-items: end; gap: 4px; text-align: right; }
.pscore .avg b { font-size: 22px; }
.pscore small { color: var(--muted); font-size: 12.5px; white-space: nowrap; }

/* Reservations */
.book-sec { margin-top: 22px; }
.book-sec:first-of-type { margin-top: 8px; }
.book-sec > h2 { margin: 0 0 4px; font: 600 20px/1.2 var(--font-display); }
.book-sec > h2 .n { font: 500 14px var(--font); color: var(--muted); }
.book-sec > p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
.bk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
.bk.is-booked { border-color: var(--ok); }
.bk-main { min-width: 0; }
.bk-main .name-row h3 { font-size: 16px; }
.bk-check { display: inline-flex; align-items: center; gap: 8px; align-self: start; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.bk-check input { width: 18px; height: 18px; margin: 0; accent-color: var(--ok); }
.bk.is-booked .bk-check { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.bk-note { grid-column: 1 / -1; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.bk-by { grid-column: 1 / -1; margin: -2px 0 0; font-size: 12px; color: var(--muted); }
details.walkins { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
details.walkins summary { cursor: pointer; font-weight: 600; }
details.walkins p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

/* Itinerary: one section per day, places in Wanderlog's order on a timeline */
.days { display: grid; gap: 24px; }
.day-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin: 0 0 10px; }
.day-num { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.day-head h2 { margin: 0; font: 600 20px/1.2 var(--font-display); }
.day-title { margin: 0; color: var(--muted); font-size: 14px; }
.day-note { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.day-empty { margin: 0; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 14px; }
.day-list { position: relative; list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.day-list::before { content: ""; position: absolute; left: 69px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.day-list li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
.it-time { text-align: right; font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.it-card { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px 12px; align-items: center; padding: 10px 14px 10px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.it-card::before { content: ""; position: absolute; left: -6px; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); transform: translate(-50%, -50%); }
.it-card.note-card { grid-template-columns: minmax(0, 1fr); padding: 10px 14px; background: transparent; border-style: dashed; color: var(--muted); font-size: 14px; }
.it-card.note-card::before { background: var(--line); }
.it-info { min-width: 0; display: grid; gap: 3px; }
.it-info .meta, .it-info .note { margin: 0; }
.it-score { display: grid; justify-items: end; gap: 4px; }
.it-score .avg b { font-size: 18px; }

/* Map */
.map-wrap { display: grid; gap: 10px; }
.map { position: relative; isolation: isolate; z-index: 0; height: min(68vh, 640px); min-height: 380px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.map-legend li { display: inline-flex; align-items: center; gap: 6px; }
.map-legend .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.map-legend .dot.wait { background: var(--surface); border: 1.5px dashed var(--muted); box-shadow: none; }
.leaflet-container { font: inherit; }
.map .leaflet-tile-pane { filter: saturate(.45) contrast(.95); }
.map.dark-tiles .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) saturate(.35) brightness(.9) contrast(.9); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); box-shadow: 0 8px 28px rgba(0,0,0,.25); }
.leaflet-popup-content { margin: 12px 14px; width: 250px !important; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.leaflet-tooltip { font: 600 12.5px var(--font); }
.pop { display: grid; gap: 6px; }
.pop-img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; display: block; background: var(--surface-2); }
.pop h3 { margin: 0; font-size: 15.5px; line-height: 1.25; }
.pop .meta { margin: 0; }
.pop .group-head { margin-top: 2px; }
.pop .links { margin: 2px 0 0; }
.pop .links button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }

/* Summary side panel */
.side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; margin-top: 16px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); scrollbar-width: thin; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side-head h2 { margin: 0; font: 600 20px/1.2 var(--font-display); }
.side-close { display: none; }
.side-sub { margin: 2px 0 14px; color: var(--muted); font-size: 13px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { padding: 10px 12px; background: var(--bg); border-radius: 10px; display: grid; gap: 2px; align-content: start; }
.kpi-l { font-size: 12.5px; color: var(--muted); }
.kpi b { font-size: 26px; font-weight: 600; line-height: 1.1; }
.kpi small { font-size: 12px; color: var(--muted); }
.side-sec { margin-top: 20px; }
.side-sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.side-note { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.kinds { width: 100%; border-collapse: collapse; font-size: 14px; }
.kinds th, .kinds td { padding: 7px 4px; text-align: left; border-bottom: 1px solid var(--line); }
.kinds thead th { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 0; }
.kinds .num { text-align: right; font-variant-numeric: tabular-nums; width: 46px; }
.kinds tbody th { font-weight: 500; }
.kinds tfoot th, .kinds tfoot td { border-bottom: 0; font-weight: 700; }
.kinds .zero { color: var(--muted); }
.kind-btn { display: block; width: 100%; border: 0; background: none; padding: 0; text-align: left; font-weight: 600; }
.kind-btn:hover { color: var(--accent); }
.kinds tr[aria-selected="true"] { background: var(--accent-soft); }
.kinds tr[aria-selected="true"] .kind-btn { color: var(--accent); }
.kbar { display: block; height: 4px; margin-top: 5px; }
.kbar span { display: block; height: 100%; background: var(--accent); border-radius: 0 2px 2px 0; min-width: 2px; }
.stack { display: flex; gap: 2px; height: 12px; background: var(--surface); }
.stack span { display: block; height: 100%; min-width: 3px; }
.stack span:last-child { border-radius: 0 4px 4px 0; }
.legend { display: grid; gap: 4px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend b { margin-left: auto; font-variant-numeric: tabular-nums; }
.sw-must { background: var(--v-must); } .sw-def { background: var(--v-def); } .sw-prob { background: var(--v-prob); } .sw-maybe { background: var(--v-maybe); }
.sw-skip { background: var(--v-skip); } .sw-wait { background: var(--v-wait); }
.meters { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.meters li { display: grid; grid-template-columns: minmax(0, 80px) minmax(0, 1fr) auto auto auto; align-items: center; gap: 8px; }
.meters .tops { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.meters .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
.meters b { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.remove-btn { display: grid; place-items: center; width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--muted); }
.remove-btn:hover { background: var(--hot-soft); color: var(--hot); }
.remove-btn svg { width: 15px; height: 15px; }
.scrim { position: fixed; inset: 0; z-index: 19; background: rgba(20,16,12,.45); }

@media (max-width: 1099px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .dash-btn { display: inline-flex; }
  .side { position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; width: min(360px, 92vw); max-height: none; margin: 0; border-radius: 16px 0 0 16px; border-right: 0; transform: translateX(105%); transition: transform .22s ease; visibility: hidden; }
  .side.open { transform: none; visibility: visible; }
  .side-close { display: grid; }
}
@media (min-width: 1100px) { .scrim { display: none; } }

footer { padding: 8px 0 40px; color: var(--muted); font-size: 13px; }
footer a { color: inherit; }

/* Trips screen */
.home-top { display: flex; align-items: center; gap: 10px; padding-top: 22px; padding-bottom: 6px; }
.home-main { padding-top: 12px; }
.home-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.trip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.trip-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.trip-open { display: block; color: inherit; text-decoration: none; flex: 1; }
.trip-open:hover h2 { color: var(--accent); }
.trip-cover { position: relative; aspect-ratio: 16 / 9; background: linear-gradient(135deg, #7c2d12, #9d174d) center / cover no-repeat; }
.trip-cover .when { position: absolute; left: 10px; top: 10px; padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 12.5px; font-weight: 600; backdrop-filter: blur(6px); }
.trip-body { padding: 14px 16px 10px; display: grid; gap: 2px; }
.trip-body h2 { margin: 2px 0 2px; font: 600 21px/1.2 var(--font-display); }
.trip-body .meta { margin: 0; }
.trip-status { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.trip-status.err { color: var(--hot); }
.trip-status.pending { color: var(--warn); }
.trip-actions { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 10px 12px; }
.trip-actions button { border: 0; background: none; padding: 5px 8px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.trip-actions button:hover { background: var(--surface-2); color: var(--ink); }
.trip-actions button.danger:hover { background: var(--hot-soft); color: var(--hot); }
.trip-actions button:disabled { opacity: .4; cursor: default; background: none; color: var(--muted); }
.team { margin: 32px 0 48px; max-width: 560px; }
.team h2 { margin: 0 0 4px; font: 600 20px/1.2 var(--font-display); }
.team > p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
.team ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
.team li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.team li .em { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.team li small { color: var(--muted); }
.team form { display: flex; gap: 8px; }
.team input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; }

/* Gate (sign in / messages) and dialogs */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.gate-card { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
.gate-card h1 { font-size: 28px; }
.gate-card > p { color: var(--muted); }
.gate-card h2 { margin: 22px 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.gate-form { display: flex; gap: 8px; }
.gate-form input, .dlg input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; padding: 10px 16px; background: var(--ink); color: var(--bg); font-weight: 600; white-space: nowrap; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--hot); color: #fff; }
.btn.small { padding: 7px 12px; font-size: 13.5px; }
.btn svg { width: 18px; height: 18px; }
.btn.google { width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 11px 16px; }
.btn.google:hover { border-color: var(--muted); }
.board-links { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.board-links a { display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: var(--ink); font-weight: 600; }
dialog.dlg { width: min(440px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
dialog.dlg::backdrop { background: rgba(20,16,12,.45); }
.dlg h2 { margin: 0 0 4px; font: 600 22px/1.2 var(--font-display); }
.dlg p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.dlg label { display: grid; gap: 4px; margin-bottom: 12px; font-size: 13.5px; font-weight: 600; }
.dlg label input { width: 100%; font-weight: 400; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.share-row { display: flex; gap: 8px; }
.share-row input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--ink); }
#shareCopy { min-width: 96px; }
.form-error { margin: 10px 0 0 !important; color: var(--hot) !important; font-size: 13.5px; }
.names { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.names button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-weight: 600; }
.names button:hover { border-color: var(--accent); color: var(--accent); }
#whoForm { display: flex; gap: 8px; }
.dlg .later { margin-top: 12px; border: 0; background: none; color: var(--muted); font-size: 13.5px; padding: 4px 0; text-decoration: underline; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.25); }

@media (max-width: 600px) {
  .hero-inner { min-height: 230px; }
  .spot { grid-template-columns: 64px minmax(0, 1fr); grid-template-areas: "thumb info" "scores scores"; padding: 14px; gap: 10px 12px; }
  .thumb { width: 64px; height: 64px; font-size: 22px; }
  .rate-btns { max-width: none; gap: 4px; }
  .rate-btn span { display: none; }
  .rate-legend { display: block; }
  .scores { grid-template-columns: minmax(0, 1fr) 108px; gap: 10px 14px; }
  .who span.lbl { display: none; }
  .tab { padding: 10px 7px; }
  .tab .long { display: none; }
  .tab .short { display: inline; }
  .dash-btn { padding: 7px 9px; }
  .dash-btn .lbl { display: none; }
  .pick { grid-template-columns: 22px 44px minmax(0, 1fr); padding: 10px; }
  .pthumb { width: 44px; height: 44px; }
  .pscore { grid-column: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; text-align: left; }
  .tier-head { flex-wrap: wrap; }
  .tier-head p { margin: 0; width: 100%; text-align: left; }
  .bk { grid-template-columns: minmax(0, 1fr); }
  .bk-check { justify-self: start; }
  .map { height: 62vh; }
  .day-list::before { left: 53px; }
  .day-list li { grid-template-columns: 48px minmax(0, 1fr); gap: 10px; }
  .it-time { font-size: 12px; }
  .it-card { grid-template-columns: 44px minmax(0, 1fr); }
  .it-card .pthumb { width: 44px; height: 44px; }
  .it-score { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
}
@media (max-width: 359px) { .scores { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-card" id="gateCard"><p>Loading…</p></div>
</div>

<!-- Trips screen (planners) -->
<div id="home" hidden>
  <header class="shell home-top">
    <div class="titles">
      <p class="eyebrow">POI Planner</p>
      <h1>Your trips</h1>
      <p class="sub" id="homeSub"></p>
    </div>
    <button class="btn ghost small" id="signOutBtn" type="button">Sign out</button>
    <button class="icon-btn theme-btn" type="button" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
    <app-switcher></app-switcher>
  </header>
  <main class="shell home-main">
    <div class="home-actions">
      <p class="sub" id="tripCount"></p>
      <button class="btn" id="newTripBtn" type="button">+ New trip</button>
    </div>
    <div class="trip-grid" id="tripGrid"></div>
    <section class="team" id="teamSec" aria-labelledby="teamTitle"></section>
  </main>
</div>

<!-- One trip -->
<div id="app" hidden>
  <header class="hero" id="hero">
    <div class="shell hero-inner">
      <div class="hero-top">
        <a class="hero-back" id="backLink" href="#" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          All trips
        </a>
        <span class="spacer"></span>
        <button class="who" id="whoBtn" type="button"></button>
        <button class="icon-btn" id="shareBtn" type="button" title="Copy this trip's link" aria-label="Copy this trip's link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        </button>
        <button class="icon-btn theme-btn" type="button" title="Switch light / dark" aria-label="Switch light or dark theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        </button>
        <app-switcher></app-switcher>
      </div>
      <div>
        <p class="eyebrow" id="tripPlace"></p>
        <h1 id="tripTitle"></h1>
        <p class="sub" id="tripSub"></p>
      </div>
    </div>
    <span class="hero-credit" id="heroCredit" hidden>Photo via Wanderlog</span>
  </header>

  <div class="shell layout">
    <div class="col-main">
      <div class="bar">
        <div class="tabs-row">
          <nav class="tabs" role="tablist" aria-label="Views">
            <button class="tab" role="tab" data-view="spots" type="button"><span class="long">All spots</span><span class="short">Spots</span></button>
            <button class="tab" role="tab" data-view="picks" type="button"><span class="long">Group picks</span><span class="short">Picks</span></button>
            <button class="tab" role="tab" data-view="book" type="button"><span class="long">Reservations</span><span class="short">Reserve</span></button>
            <button class="tab" role="tab" data-view="days" type="button"><span class="long">Itinerary</span><span class="short">Days</span></button>
            <button class="tab" role="tab" data-view="map" type="button">Map</button>
          </nav>
          <button class="dash-btn" id="dashBtn" type="button" aria-controls="side" aria-expanded="false" aria-label="Summary" title="Summary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
            <span class="lbl">Summary</span>
          </button>
        </div>
        <div class="filters">
          <div class="chips" id="listChips" role="group" aria-label="Filters"></div>
          <div class="tools" id="spotTools">
            <select id="sortSel" aria-label="Sort">
              <option value="list">Wanderlog order</option>
              <option value="group">Group favorites</option>
              <option value="need">Reservation need</option>
            </select>
            <label class="toggle"><input type="checkbox" id="unratedOnly"> Not rated by me</label>
          </div>
        </div>
      </div>
      <div class="banner" id="banner" role="status" hidden></div>
      <main id="main"></main>
      <footer id="foot"></footer>
    </div>
    <aside class="side" id="side" aria-label="Trip summary"></aside>
  </div>
  <div class="scrim" id="scrim" hidden></div>
</div>

<dialog class="dlg" id="whoDlg" aria-labelledby="whoTitle">
  <h2 id="whoTitle">Who's voting?</h2>
  <p id="whoHint"></p>
  <div class="names" id="whoNames"></div>
  <form id="whoForm">
    <input id="whoInput" maxlength="30" placeholder="New here? Type your name" autocomplete="given-name" aria-label="Your name">
    <button class="btn" type="submit">Join</button>
  </form>
  <button class="later" id="whoLater" type="button">Just looking for now</button>
</dialog>

<dialog class="dlg" id="newDlg" aria-labelledby="newTitle">
  <h2 id="newTitle">New trip</h2>
  <p>Paste the trip's Wanderlog link (in Wanderlog: Share → copy link). Its places show up here within about 10–20 minutes.</p>
  <form id="newForm" novalidate>
    <label>Wanderlog link<input id="newLink" inputmode="url" autocomplete="off" placeholder="https://wanderlog.com/view/…"></label>
    <label>Name <small>(optional; uses the Wanderlog trip name)</small><input id="newName" maxlength="80" autocomplete="off"></label>
    <div class="dlg-actions">
      <button class="btn ghost" type="button" data-close>Cancel</button>
      <button class="btn" type="submit">Add trip</button>
    </div>
    <p class="form-error" id="newError" hidden></p>
  </form>
</dialog>

<!-- Share a trip: the link with a one-tap Copy button -->
<dialog class="dlg" id="shareDlg" aria-labelledby="shareTitle">
  <h2 id="shareTitle">Share this trip</h2>
  <p>Anyone with this link can view the trip and vote. No account needed.</p>
  <div class="share-row">
    <input id="shareUrl" readonly aria-label="Trip link">
    <button class="btn" id="shareCopy" type="button">Copy</button>
  </div>
  <div class="dlg-actions" style="margin-top:14px"><button class="btn ghost" type="button" data-close>Done</button></div>
</dialog>

<!-- Confirm / ask: filled in by askDialog() -->
<dialog class="dlg" id="askDlg" aria-labelledby="askTitle">
  <h2 id="askTitle"></h2>
  <p id="askBody"></p>
  <form id="askForm" method="dialog">
    <input id="askInput" maxlength="80" autocomplete="off" hidden>
    <div class="dlg-actions" style="margin-top:14px">
      <button class="btn ghost" type="button" data-close>Cancel</button>
      <button class="btn" id="askOk" type="submit" value="ok"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(() => {
  // POI Planner's own Firebase project (rules: firestore.rules).
  //   team/main                  who can plan (Google sign-in)
  //   plans/{tripId}             a trip and its places, imported from Wanderlog by the sync job
  //   planSources/{tripId}       the trip's Wanderlog link (planners only)
  //   rankBoards/{tripId}/...    everyone's votes and booking notes
  const firebaseConfig = {
    apiKey: "AIzaSyCwUhxT7pmI8cgk_7j-K0YbXwuThm636Oo",
    authDomain: "poi-planner-de173.firebaseapp.com",
    projectId: "poi-planner-de173",
    storageBucket: "poi-planner-de173.firebasestorage.app",
    messagingSenderId: "225752772584",
    appId: "1:225752772584:web:a091a48cdcb78884affe5d"
  };
  const SCORE_WORDS = ["", "Skip it", "Meh", "Sure", "Want to", "Love it"];
  const TOP_MAX = 5; // places each person can put in their Top 5 (all equal, no order)
  const TIERS = {
    must:  { name: "Must go",       cls: "t-must",  hint: "In someone's Top 5" },
    def:   { name: "Definitely go", cls: "t-def",   hint: "Average 4 or more and nobody below 3" },
    prob:  { name: "Probably",      cls: "t-prob",  hint: "Average 3.25 or more" },
    maybe: { name: "Maybe",         cls: "t-maybe", hint: "Average 2.5 or more" },
    skip:  { name: "Skip",          cls: "t-skip",  hint: "Average below 2.5" },
    wait:  { name: "Needs votes",   cls: "t-wait",  hint: "Fewer than half the group has rated it" },
  };
  const TIER_ORDER = ["must", "def", "prob", "maybe", "skip", "wait"];
  const GOING = ["must", "def"];           // counted as "Go" in the summary
  const WANTED = ["must", "def", "prob"];  // what the group wants (reservations to make first)
  // Place types for the summary (set by the sync script from Wanderlog's categories).
  const KINDS = {
    restaurant: "Restaurants", cafe: "Cafés & bakeries", bar: "Bars", sight: "Museums & sights",
    area: "Neighborhoods", market: "Markets & shopping", activity: "Activities & events", other: "Other",
  };
  const NEW_TRIP = "New trip"; // placeholder title until the first import (matches the sync script)
  const LS_TRIPS = "tripRanker.trips";
  const WANDERLOG_LINK = /^https:\/\/(www\.)?wanderlog\.com\/(view|plan|tp)\/[A-Za-z0-9]+/;

  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const FV = () => firebase.firestore.FieldValue;

  const state = {
    user: null, authReady: false, team: null, isPlanner: false, isOwner: false,
    plans: [],
    tripId: null, plan: null, board: null, boardKey: "", months: [],
    voters: [], spots: {}, me: null,
    view: "spots", list: "all", kind: null, sort: "list", unratedOnly: false,
    pendingRender: false, map: null,
  };
  let tripUnsubs = [], homeUnsubs = [];
  const votersRef = () => db.collection("rankBoards").doc(state.tripId).collection("voters");
  const spotsRef = () => db.collection("rankBoards").doc(state.tripId).collection("spots");

  /* ---------- Small UI helpers ---------- */

  let toastTimer;
  function toast(text) {
    const t = $("#toast");
    t.textContent = text;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }

  // A confirm (or, with `value`, a one-line text prompt). Resolves to true / the text, or null if cancelled.
  function askDialog({ title, body = "", confirm = "OK", danger = false, value = null }) {
    const dlg = $("#askDlg");
    $("#askTitle").textContent = title;
    $("#askBody").textContent = body;
    $("#askBody").hidden = !body;
    const input = $("#askInput");
    input.hidden = value === null;
    input.value = value ?? "";
    const ok = $("#askOk");
    ok.textContent = confirm;
    ok.className = `btn${danger ? " danger" : ""}`;
    const form = $("#askForm"), cancelBtn = $("#askDlg [data-close]");
    return new Promise((resolve) => {
      let settled = false;
      const finish = (result) => {
        if (settled) return;
        settled = true;
        form.removeEventListener("submit", onSubmit);
        cancelBtn.removeEventListener("click", onCancel);
        dlg.removeEventListener("cancel", onCancel);
        dlg.removeEventListener("close", onCancel);
        if (dlg.open) dlg.close();
        resolve(result);
      };
      const onSubmit = (e) => { e.preventDefault(); finish(value === null ? true : input.value.trim() || null); };
      const onCancel = () => finish(null); // Cancel button, Escape, or the dialog closing any other way
      form.addEventListener("submit", onSubmit);
      cancelBtn.addEventListener("click", onCancel);
      dlg.addEventListener("cancel", onCancel);
      dlg.addEventListener("close", onCancel);
      dlg.showModal();
      (value === null ? ok : input).focus();
    });
  }
  document.querySelectorAll("dialog [data-close]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));

  function copyLink(id, title) {
    $("#shareTitle").textContent = title ? `Share ${title}` : "Share this trip";
    $("#shareUrl").value = `${location.origin}${location.pathname}#trip/${id}`;
    $("#shareCopy").textContent = "Copy";
    $("#shareDlg").showModal();
    $("#shareCopy").focus();
  }
  $("#shareCopy").addEventListener("click", async () => {
    const input = $("#shareUrl");
    let ok = false;
    try {
      await navigator.clipboard.writeText(input.value);
      ok = true;
    } catch (e) {
      // Some browsers block the clipboard API; copying the selected text still works there.
      input.focus();
      input.select();
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    }
    $("#shareCopy").textContent = ok ? "Copied ✓" : "Select & copy";
    if (!ok) { input.focus(); input.select(); }
  });
  $("#shareUrl").addEventListener("focus", (e) => e.target.select());

  function showOnly(which) {
    $("#gate").hidden = which !== "gate";
    $("#home").hidden = which !== "home";
    $("#app").hidden = which !== "app";
  }
  function showGate(html) {
    showOnly("gate");
    $("#gateCard").innerHTML = html;
  }

  /* ---------- Trips opened on this device (for people who aren't planners) ---------- */

  function rememberedTrips() {
    try { return JSON.parse(lsGet(LS_TRIPS) || "[]").filter((t) => t && t.id); } catch (e) { return []; }
  }
  function rememberTrip(id, title) {
    const list = rememberedTrips().filter((t) => t.id !== id);
    list.unshift({ id, title });
    lsSet(LS_TRIPS, JSON.stringify(list.slice(0, 12)));
  }

  /* ---------- Links ---------- */

  async function sha256hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  // Older board links (#slug:secret) point at the trip whose id was derived from them.
  const oldLinkTripId = async (slug, secret) => `${slug}-${(await sha256hex(`board:${slug}:${secret}`)).slice(0, 32)}`;

  function parseRoute(hash) {
    const h = String(hash || "").replace(/^.*#/, "");
    let m = h.match(/^trip\/([A-Za-z0-9-]{30,80})$/);
    if (m) return { trip: m[1] };
    m = h.match(/^([a-z0-9-]{2,40}):([A-Za-z0-9_-]{16,})$/);
    if (m) return { old: { slug: m[1], secret: m[2] } };
    return { home: true };
  }
  function randomId() {
    const abc = "abcdefghijklmnopqrstuvwxyz0123456789";
    return [...crypto.getRandomValues(new Uint8Array(32))].map((n) => abc[n % abc.length]).join("");
  }

  /* ---------- Routing and sign-in ---------- */

  let routeSeq = 0;
  async function route() {
    if (!state.authReady) return;
    const seq = ++routeSeq;
    const r = parseRoute(location.hash);
    if (r.old) {
      if (!window.crypto?.subtle) return showGate(`<p>This browser can't open this link. Try a current version of Safari, Chrome or Firefox.</p>`);
      const id = await oldLinkTripId(r.old.slug, r.old.secret);
      if (seq !== routeSeq) return;
      history.replaceState(null, "", `#trip/${id}`);
      return openTrip(id);
    }
    if (r.trip) return openTrip(r.trip);
    return openHome();
  }

  async function loadTeam() {
    Object.assign(state, { team: null, isPlanner: false, isOwner: false });
    const u = state.user;
    if (!u || u.isAnonymous) return;
    try {
      const snap = await db.collection("team").doc("main").get();
      if (!snap.exists) return;
      setTeam(snap.data());
    } catch (e) { /* not on the planner list */ }
  }
  function setTeam(team) {
    const email = (state.user?.email || "").toLowerCase();
    state.team = team;
    state.isPlanner = !!team && (team.planners || []).includes(email);
    state.isOwner = !!team && team.owner === email;
  }

  async function signIn() {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try {
      await auth.signInWithPopup(provider);
    } catch (e) {
      if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return auth.signInWithRedirect(provider);
      if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") toast(`Couldn't sign in: ${e.message}`);
    }
  }

  auth.onAuthStateChanged(async (user) => {
    state.user = user;
    await loadTeam();
    state.authReady = true;
    route();
  });
  window.addEventListener("hashchange", route);

  /* ---------- Sign-in screen (no planner signed in) ---------- */

  function showSignIn(note) {
    stopTrip();
    stopHome();
    const trips = rememberedTrips();
    const email = state.user && !state.user.isAnonymous ? state.user.email : null;
    showGate(`
      <p class="eyebrow">POI Planner</p>
      <h1>Plan trips with your group</h1>
      ${email
        ? `<p>${esc(email)} isn't on the planner list yet. Ask the trip owner to add you under Co-planners.</p>
           <button class="btn ghost" type="button" data-signout>Sign out</button>`
        : `<p>${esc(note || "Planners sign in to see every trip and add new ones.")}</p>
           <button class="btn google" type="button" data-signin>
             <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.1a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 7.1l3.6 2.8C6.6 7.3 9.1 5.4 12 5.4z"/></svg>
             Sign in with Google
           </button>`}
      <h2>Got a trip link?</h2>
      <form class="gate-form" id="gateForm">
        <input id="gateInput" placeholder="Paste the trip link" aria-label="Trip link" autocomplete="off">
        <button class="btn" type="submit">Open</button>
      </form>
      ${trips.length ? `<h2>Opened on this device</h2><ul class="board-links">${trips.map((t) => `<li><a href="#trip/${esc(t.id)}">${esc(t.title || "Trip")}</a></li>`).join("")}</ul>` : ""}`);
    $("#gateForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const r = parseRoute($("#gateInput").value.trim());
      if (r.trip) location.hash = `trip/${r.trip}`;
      else if (r.old) location.hash = `${r.old.slug}:${r.old.secret}`;
      else toast("That doesn't look like a trip link.");
    });
  }
  $("#gate").addEventListener("click", (e) => {
    if (e.target.closest("[data-signin]")) signIn();
    if (e.target.closest("[data-signout]")) auth.signOut();
  });

  /* ---------- Trips screen ---------- */

  function stopHome() { homeUnsubs.forEach((u) => u()); homeUnsubs = []; }

  function openHome() {
    stopTrip();
    if (!state.user || state.user.isAnonymous || !state.isPlanner) return showSignIn();
    document.title = "POI Planner";
    showOnly("home");
    renderHome();
    if (homeUnsubs.length) return;
    homeUnsubs.push(db.collection("plans").onSnapshot((snap) => {
      state.plans = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderHome();
    }, (err) => { console.error(err); toast("Couldn't load your trips. Reload to try again."); }));
    homeUnsubs.push(db.collection("team").doc("main").onSnapshot((snap) => {
      setTeam(snap.data() || null);
      if (!state.isPlanner) return showSignIn();
      renderHome();
    }, () => {}));
  }

  function tripStatus(p) {
    if (p.status === "error") return `<p class="trip-status err">Couldn't import from Wanderlog: ${esc(p.error || "unknown error")}</p>`;
    if (p.status === "pending") return `<p class="trip-status pending">${p.places ? "Refreshing" : "Importing"} from Wanderlog… usually within 10–20 minutes</p>`;
    return p.syncedAt ? `<p class="trip-status">Refreshed from Wanderlog ${esc(ago(p.syncedAt))}</p>` : "";
  }

  function renderHome() {
    $("#homeSub").textContent = state.user?.email ? `Signed in as ${state.user.email}` : "";
    const today = todayNoon();
    const upcoming = (p) => !p.endDate || day(p.endDate) >= today;
    const sorted = [...state.plans].sort((a, b) =>
      (upcoming(b) - upcoming(a))
      || (upcoming(a) ? (a.startDate || "9999").localeCompare(b.startDate || "9999") : (b.startDate || "").localeCompare(a.startDate || "")));
    $("#tripCount").textContent = sorted.length ? `${sorted.length} trip${sorted.length === 1 ? "" : "s"}` : "";
    $("#tripGrid").innerHTML = sorted.length ? sorted.map((p) => {
      const togo = daysToGoFor(p.startDate, p.endDate);
      return `<article class="trip-card" data-trip="${esc(p.id)}">
        <a class="trip-open" href="#trip/${esc(p.id)}">
          <div class="trip-cover"${p.hero ? ` style="background-image:url('${esc(p.hero)}')"` : ""}>${togo ? `<span class="when">${esc(togo)}</span>` : ""}</div>
          <div class="trip-body">
            ${p.destination ? `<p class="eyebrow">${esc(p.destination)}</p>` : ""}
            <h2>${esc(p.title || NEW_TRIP)}</h2>
            <p class="meta">${[fmtRange(p.startDate, p.endDate), p.placeCount ? `${p.placeCount} spots` : ""].filter(Boolean).join(" · ") || "Waiting for Wanderlog"}</p>
            ${tripStatus(p)}
          </div>
        </a>
        <div class="trip-actions">
          <button type="button" data-act="copy">Copy link</button>
          <button type="button" data-act="refresh"${p.status === "pending" ? " disabled" : ""}>Refresh</button>
          <button type="button" data-act="rename">Rename</button>
          <button type="button" class="danger" data-act="delete">Delete</button>
        </div>
      </article>`;
    }).join("") : `<div class="empty-note">No trips yet. Add one from a Wanderlog link.</div>`;
    renderTeam();
  }

  function renderTeam() {
    const team = state.team;
    if (!team) { $("#teamSec").innerHTML = ""; return; }
    const planners = [...(team.planners || [])].sort((a, b) => (a === team.owner ? -1 : b === team.owner ? 1 : a.localeCompare(b)));
    $("#teamSec").innerHTML = `
      <h2 id="teamTitle">Co-planners</h2>
      <p>Co-planners sign in with Google to see every trip and add new ones. Friends don't need this: they vote from a trip's link.</p>
      <ul>${planners.map((e) => `<li><span class="em">${esc(e)}</span>${e === team.owner ? "<small>Owner</small>" : state.isOwner ? `<button class="btn ghost small" type="button" data-unplan="${esc(e)}">Remove</button>` : ""}</li>`).join("")}</ul>
      ${state.isOwner ? `<form id="teamForm"><input id="teamEmail" type="email" placeholder="Their Google email" aria-label="Co-planner's Google email" autocomplete="off"><button class="btn" type="submit">Add</button></form>` : ""}`;
  }

  async function savePlanners(planners) {
    try {
      await db.collection("team").doc("main").update({ planners, updatedAt: FV().serverTimestamp() });
    } catch (e) { console.error(e); toast("Couldn't update co-planners."); }
  }
  $("#teamSec").addEventListener("submit", async (e) => {
    if (e.target.id !== "teamForm") return;
    e.preventDefault();
    const email = $("#teamEmail").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("Enter their Google email address.");
    const planners = state.team.planners || [];
    if (planners.includes(email)) return toast(`${email} is already a co-planner.`);
    await savePlanners([...planners, email]);
    toast(`Added ${email}. They can sign in with that Google account.`);
  });
  $("#teamSec").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-unplan]");
    if (!b) return;
    const email = b.dataset.unplan;
    const ok = await askDialog({ title: `Remove ${email}?`, body: "They'll no longer see the trip list or add trips. Trip links they already have keep working.", confirm: "Remove", danger: true });
    if (ok) await savePlanners((state.team.planners || []).filter((x) => x !== email));
  });

  $("#tripGrid").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const id = btn.closest("[data-trip]").dataset.trip;
    const plan = state.plans.find((p) => p.id === id);
    const title = plan?.title || NEW_TRIP;
    try {
      if (btn.dataset.act === "copy") return copyLink(id, title);
      if (btn.dataset.act === "refresh") return await requestRefresh(id, title);
      if (btn.dataset.act === "rename") {
        const name = await askDialog({ title: "Rename trip", value: title, confirm: "Save" });
        if (name && name !== title) await db.collection("plans").doc(id).update({ title: name.slice(0, 80) });
        return;
      }
      if (btn.dataset.act === "delete") {
        const ok = await askDialog({ title: `Delete ${title}?`, body: "The trip and its link stop working for everyone. This can't be undone.", confirm: "Delete trip", danger: true });
        if (!ok) return;
        const batch = db.batch();
        batch.delete(db.collection("plans").doc(id));
        batch.delete(db.collection("planSources").doc(id));
        await batch.commit();
        toast(`Deleted ${title}.`);
      }
    } catch (err) { console.error(err); toast("That didn't work. Try again."); }
  });

  async function requestRefresh(id, title) {
    const batch = db.batch();
    batch.update(db.collection("plans").doc(id), { status: "pending" });
    batch.update(db.collection("planSources").doc(id), { requestedAt: FV().serverTimestamp() });
    await batch.commit();
    toast(`${title} will refresh from Wanderlog within about 10–20 minutes.`);
  }

  $("#newTripBtn").addEventListener("click", () => {
    $("#newForm").reset();
    $("#newError").hidden = true;
    $("#newDlg").showModal();
  });
  $("#newForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const link = $("#newLink").value.trim();
    const name = $("#newName").value.trim().replace(/\s+/g, " ").slice(0, 80);
    const err = $("#newError");
    if (!WANDERLOG_LINK.test(link)) {
      err.textContent = "Paste a Wanderlog trip link. It starts with https://wanderlog.com/view/ or /plan/.";
      err.hidden = false;
      return;
    }
    const id = randomId();
    const email = state.user.email.toLowerCase();
    try {
      const batch = db.batch();
      batch.set(db.collection("planSources").doc(id), { link, createdBy: email, createdAt: FV().serverTimestamp(), requestedAt: FV().serverTimestamp() });
      batch.set(db.collection("plans").doc(id), { title: name || NEW_TRIP, status: "pending", createdBy: email, createdAt: FV().serverTimestamp() });
      await batch.commit();
      $("#newDlg").close();
      toast("Trip added. Its places will show up within about 10–20 minutes.");
    } catch (ex) {
      console.error(ex);
      err.textContent = "Couldn't add the trip. Check you're still signed in and try again.";
      err.hidden = false;
    }
  });
  $("#signOutBtn").addEventListener("click", () => auth.signOut());

  /* ---------- One trip ---------- */

  function stopTrip() {
    tripUnsubs.forEach((u) => u());
    tripUnsubs = [];
    destroyMap();
    setDrawer(false);
    state.tripId = null;
  }

  function openTrip(id) {
    stopHome();
    if (!state.user) {
      showGate(`<p>Opening trip…</p>`);
      auth.signInAnonymously().catch(() => showGate(`<p>Couldn't connect. Check your connection and reload.</p>`));
      return; // signing in calls route() again
    }
    if (state.tripId === id && tripUnsubs.length) { renderHeader(); return; }
    stopTrip();
    Object.assign(state, {
      tripId: id, plan: null, board: null, boardKey: "", months: [], voters: [], spots: {},
      view: "spots", list: "all", kind: null, sort: "list", unratedOnly: false,
    });
    try { state.me = JSON.parse(lsGet(`tripRanker.me.${id}`) || "null"); } catch (e) { state.me = null; }
    showGate(`<p>Opening trip…</p>`);
    let first = true;
    tripUnsubs.push(db.collection("plans").doc(id).onSnapshot((snap) => {
      if (!snap.exists) return tripMissing();
      const plan = snap.data();
      state.plan = plan;
      rememberTrip(id, plan.title);
      const key = Array.isArray(plan.places) ? JSON.stringify([plan.places, plan.lists, plan.itinerary, plan.startDate, plan.endDate]) : "";
      const placesChanged = key !== state.boardKey;
      if (placesChanged) {
        state.boardKey = key;
        state.board = key ? { lists: plan.lists || [], places: plan.places, itinerary: plan.itinerary || [], startDate: plan.startDate, endDate: plan.endDate } : null;
        state.months = state.board ? tripMonths(state.board) : [];
      }
      showOnly("app");
      renderHeader();
      if (first || placesChanged) render();
      first = false;
    }, (err) => {
      console.error(err);
      if (err.code === "permission-denied") return tripMissing();
      showGate(`<p>Lost the connection to this trip. Reload to try again.</p>`);
    }));
    connectVotes();
  }

  function tripMissing() {
    stopTrip();
    showGate(`<p class="eyebrow">POI Planner</p><h1>Trip not found</h1>
      <p>This trip was deleted, or the link is incomplete. Ask whoever shared it for a fresh link.</p>
      <a class="btn ghost" href="#">Go to POI Planner</a>`);
  }

  function connectVotes() {
    let askedName = false;
    tripUnsubs.push(votersRef().onSnapshot((snap) => {
      state.voters = snap.docs.map((d) => ({ id: d.id, name: d.data().name || d.id, scores: cleanScores(d.data().scores), top: cleanTop(d.data().top) }));
      showBanner("");
      renderHeader();
      scheduleRender();
      if (!askedName && !state.me && state.board) { askedName = true; openWho(); }
    }, dbError));
    tripUnsubs.push(spotsRef().onSnapshot((snap) => {
      state.spots = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
      scheduleRender();
    }, dbError));
  }
  function dbError(err) {
    console.error(err);
    showBanner(err && err.code === "permission-denied"
      ? "Voting isn't available for this trip right now."
      : "Lost the connection to the votes database. Reload to try again.");
  }
  function showBanner(text) {
    const b = $("#banner");
    b.textContent = text;
    b.hidden = !text;
  }
  function cleanScores(raw) {
    const out = {};
    for (const [k, v] of Object.entries(raw || {})) if (Number.isInteger(v) && v >= 1 && v <= 5) out[k] = v;
    return out;
  }

  function cleanTop(raw) {
    return Array.isArray(raw) ? [...new Set(raw.filter((x) => typeof x === "string"))].slice(0, TOP_MAX) : [];
  }

  const myVoter = () => state.voters.find((v) => v.id === state.me?.id);
  const myScore = (id) => myVoter()?.scores[id] || 0;
  const myTop = () => myVoter()?.top || [];

  // Add or remove a place from your Top 5. Adding one also rates it 5.
  async function toggleTop(placeId) {
    if (!state.me) return openWho("Pick your name first, then choose your Top 5.");
    const mine = myTop();
    const on = mine.includes(placeId);
    if (!on && mine.length >= TOP_MAX) return toast(`You've picked all ${TOP_MAX}. Tap ★ on one of them to free a spot.`);
    const update = {
      name: myVoter()?.name || state.me.name,
      top: on ? FV().arrayRemove(placeId) : FV().arrayUnion(placeId),
      updatedAt: FV().serverTimestamp(),
    };
    if (!on && myScore(placeId) !== 5) update.scores = { [placeId]: 5 };
    try {
      await votersRef().doc(state.me.id).set(update, { merge: true });
      if (!on && mine.length + 1 === TOP_MAX) toast(`That's your Top ${TOP_MAX}.`);
    } catch (e) { dbError(e); }
  }

  async function setScore(placeId, value) {
    if (!state.me) return openWho("Pick your name first, then tap a score.");
    const clear = myScore(placeId) === value; // tapping your current score clears it
    try {
      await votersRef().doc(state.me.id).set({
        name: myVoter()?.name || state.me.name,
        scores: { [placeId]: clear ? FV().delete() : value },
        updatedAt: FV().serverTimestamp(),
      }, { merge: true });
    } catch (e) { dbError(e); }
  }

  async function saveSpot(placeId, fields) {
    try {
      await spotsRef().doc(placeId).set({ ...fields, by: myVoter()?.name || state.me?.name || "Someone", updatedAt: FV().serverTimestamp() }, { merge: true });
    } catch (e) { dbError(e); }
  }

  // Planners can take someone off a trip, along with their votes.
  async function removeVoter(voterId) {
    const v = state.voters.find((x) => x.id === voterId);
    if (!v) return;
    const n = Object.keys(v.scores).length;
    const ok = await askDialog({
      title: `Remove ${v.name}?`,
      body: `${v.name} will be removed from this trip, along with ${n ? `all ${n} of their ratings` : "their name (they haven't rated anything yet)"}. This can't be undone.`,
      confirm: `Remove ${v.name}`,
      danger: true,
    });
    if (!ok) return;
    try {
      await votersRef().doc(voterId).delete();
      if (state.me?.id === voterId) { state.me = null; lsDel(`tripRanker.me.${state.tripId}`); renderHeader(); }
      toast(`Removed ${v.name} and their ratings.`);
    } catch (e) { console.error(e); toast(`Couldn't remove ${v.name}.`); }
  }

  /* ---------- Derived data ---------- */

  const places = () => state.board?.places || [];
  const inList = (p) => (state.list === "all" || p.lists.includes(state.list)) && (!state.kind || (p.kind || "other") === state.kind);
  const orderedVoters = () => {
    const me = state.me?.id;
    return [...state.voters].sort((a, b) => (a.id === me ? -1 : b.id === me ? 1 : a.name.localeCompare(b.name)));
  };

  function stats(p) {
    const n = state.voters.length;
    const votes = state.voters.map((v) => v.scores[p.id]).filter(Boolean);
    const count = votes.length;
    const avg = count ? votes.reduce((a, b) => a + b, 0) / count : 0;
    const min = count ? Math.min(...votes) : 0, max = count ? Math.max(...votes) : 0;
    const fives = votes.filter((v) => v === 5).length;
    const topBy = state.voters.filter((v) => v.top.includes(p.id));
    let tier = "wait";
    if (count && count >= Math.max(1, Math.ceil(n / 2))) {
      tier = avg >= 4 && min >= 3 ? "def" : avg >= 3.25 ? "prob" : avg >= 2.5 ? "maybe" : "skip";
    }
    if (topBy.length) tier = "must";
    return { n, count, avg, min, max, fives, tier, topBy, tops: topBy.length, split: count >= 2 && max - min >= 3 };
  }
  const byGroup = (a, b) => {
    const sa = stats(a), sb = stats(b);
    return TIER_ORDER.indexOf(sa.tier) - TIER_ORDER.indexOf(sb.tier) || sb.tops - sa.tops || sb.avg - sa.avg || sb.fives - sa.fives || sb.count - sa.count || a.name.localeCompare(b.name);
  };

  // Months the trip covers (0-11). Without dates, every month counts.
  function tripMonths(board) {
    if (!board.startDate || !board.endDate) return [...Array(12).keys()];
    const out = [];
    const d = new Date(board.startDate + "T12:00:00"), end = new Date(board.endDate + "T12:00:00");
    d.setDate(1);
    while (d <= end && out.length < 12) { out.push(d.getMonth()); d.setMonth(d.getMonth() + 1); }
    return out;
  }
  // Wanderlog's 1-5 "booking needed" estimate, worst case across the trip's months.
  function need(p) {
    if (!p.booking) return null;
    let wd = 0, we = 0;
    for (const m of state.months) { wd = Math.max(wd, p.booking.weekdays?.[m] || 0); we = Math.max(we, p.booking.weekends?.[m] || 0); }
    if (!wd && !we) return null;
    const level = Math.max(wd, we);
    let label = level >= 5 ? "Book well ahead" : level === 4 ? "Reserve ahead" : level === 3 ? "Reservation recommended" : level === 2 ? "Walk-in usually fine" : "No reservation needed";
    if (we >= 3 && wd <= 2) label = "Book for weekends";
    return { level, wd, we, label, cls: level >= 4 ? "res-hi" : level === 3 ? "res-mid" : "res-lo" };
  }
  const wanderlogBooked = (p) => p.notes.some((n) => /^reservation/i.test(n));
  const isBooked = (p) => (state.spots[p.id] && typeof state.spots[p.id].booked === "boolean" ? state.spots[p.id].booked : wanderlogBooked(p));
  // Needs a reservation (Wanderlog level 3+) and nobody has booked it yet.
  const toBook = (p) => !isBooked(p) && !p.closed && (need(p)?.level || 0) >= 3;

  /* ---------- Formatting ---------- */

  const day = (s) => new Date(s + "T12:00:00");
  const todayNoon = () => { const t = new Date(); t.setHours(12, 0, 0, 0); return t; };
  const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const fmtDay = (s, o) => day(s).toLocaleDateString("en-US", o);
  function fmtRange(a, b) {
    if (!a) return "";
    if (!b || a === b) return fmtDay(a, { month: "short", day: "numeric", year: "numeric" });
    const sameYear = a.slice(0, 4) === b.slice(0, 4);
    return `${fmtDay(a, { month: "short", day: "numeric", ...(sameYear ? {} : { year: "numeric" }) })} – ${fmtDay(b, { month: "short", day: "numeric", year: "numeric" })}`;
  }
  function fmtTime(t) {
    const [h, m] = t.split(":").map(Number);
    return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
  }
  const fmtCount = (n) => (n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n));
  const toDate = (t) => (t?.toDate ? t.toDate() : t ? new Date(t) : null);
  function ago(t) {
    const d = toDate(t);
    if (!d) return "";
    const secs = (d - Date.now()) / 1000;
    const rtf = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
    for (const [unit, size] of [["day", 86400], ["hour", 3600], ["minute", 60]]) if (Math.abs(secs) >= size) return rtf.format(Math.round(secs / size), unit);
    return "just now";
  }
  function daysToGoFor(start, end) {
    if (!start) return "";
    const today = todayNoon();
    const d = Math.round((day(start) - today) / 864e5);
    const e = end ? Math.round((day(end) - today) / 864e5) : d;
    if (d > 1) return `${d} days to go`;
    if (d === 1) return "Tomorrow!";
    if (e >= 0) return "Happening now";
    return "";
  }
  const daysToGo = () => daysToGoFor(state.board?.startDate, state.board?.endDate);
  const mapsUrl = (p) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + (p.address ? ", " + p.address : ""))}&query_place_id=${encodeURIComponent(p.id)}`;
  const listColor = (name) => state.board.lists.find((l) => l.name === name)?.color || "var(--muted)";

  /* ---------- Shared pieces ---------- */

  function peopleHTML(p) {
    if (!state.voters.length) return `<span class="split">No one has joined yet</span>`;
    return `<ul class="people">${orderedVoters().map((v) => {
      const s = v.scores[p.id];
      const me = v.id === state.me?.id ? " me" : "";
      return s
        ? `<li class="person s${s}${me}" title="${esc(v.name)}: ${s} – ${SCORE_WORDS[s]}"><span>${esc(v.name)}${v.top.includes(p.id) ? " ★" : ""}</span><b>${s}</b></li>`
        : `<li class="person none${me}" title="${esc(v.name)} hasn't rated this yet">${esc(v.name)} –</li>`;
    }).join("")}</ul>`;
  }
  function tierHTML(s) {
    const t = TIERS[s.tier];
    return `<span class="tier ${t.cls}" title="${esc(t.hint)}">${t.name}</span>`;
  }
  function badgesHTML(p) {
    const out = [];
    if (p.closed) out.push(`<span class="badge closed-b">Closed</span>`);
    if (isBooked(p)) out.push(`<span class="badge booked-b">✓ Booked</span>`);
    else {
      const n = need(p);
      if (n) out.push(`<span class="badge ${n.cls}" title="Wanderlog's estimate for your travel months: weekdays ${n.wd}/5, weekends ${n.we}/5">${n.label}</span>`);
    }
    return out.join("");
  }
  function scheduledHTML(p) {
    if (!p.scheduled.length) return "";
    const when = p.scheduled.map((s) => fmtDay(s.date, { weekday: "short", month: "short", day: "numeric" }) + (s.time ? ` · ${fmtTime(s.time)}` : "")).join(", ");
    return `<p class="sched">On the itinerary: ${esc(when)}</p>`;
  }
  function thumbHTML(p, cls) {
    const initial = esc((p.name || "?").trim().charAt(0));
    return `<div class="${cls}">${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}${cls === "thumb" ? `<span aria-hidden="true">${p.image ? "" : initial}</span>` : ""}</div>`;
  }
  function metaHTML(p, withList) {
    const bits = [];
    if (p.category) bits.push(esc(p.category));
    if (p.rating) bits.push(`★ ${p.rating.toFixed(1)}${p.ratings ? ` (${fmtCount(p.ratings)})` : ""}`);
    if (p.price) bits.push("$".repeat(p.price));
    if (withList) bits.push(esc(p.lists.join(", ")));
    return `<p class="meta">${bits.join(" · ")}</p>`;
  }
  function groupHeadHTML(s) {
    return `<div class="group-head">
        <span class="row-label">Group</span>
        ${s.count ? `<span class="avg"><b>${s.avg.toFixed(1)}</b><small>avg</small></span>` : ""}
        ${tierHTML(s)}
        ${s.split ? `<span class="split">Split vote</span>` : ""}
      </div>`;
  }
  // Everyone's score for one place, highest first; people who haven't rated it go last.
  function votesListHTML(p) {
    if (!state.voters.length) return `<p class="votes-list empty">No one has joined yet</p>`;
    const rows = state.voters
      .map((v) => ({ v, s: v.scores[p.id] || 0 }))
      .sort((a, b) => b.s - a.s || b.v.top.includes(p.id) - a.v.top.includes(p.id) || (a.v.id === state.me?.id ? -1 : b.v.id === state.me?.id ? 1 : a.v.name.localeCompare(b.v.name)));
    return `<ul class="votes-list" aria-label="Everyone's scores for ${esc(p.name)}">${rows.map(({ v, s }) => {
      const me = v.id === state.me?.id ? ` class="me"` : "";
      return s
        ? `<li${me} title="${esc(v.name)}: ${s} – ${SCORE_WORDS[s]}"><span class="nm">${esc(v.name)}${v.top.includes(p.id) ? topStar(v) : ""}</span><b class="sc s${s}">${s}</b></li>`
        : `<li${me} title="${esc(v.name)} hasn't rated this yet"><span class="nm">${esc(v.name)}${v.top.includes(p.id) ? topStar(v) : ""}</span><span class="sc none">–</span></li>`;
    }).join("")}</ul>`;
  }

  /* ---------- View: all spots ---------- */

  function scoresHTML(p) {
    const mine = myScore(p.id);
    const btns = [1, 2, 3, 4, 5].map((v) =>
      `<button type="button" class="rate-btn${mine === v ? ` s${v}` : ""}" data-rate="${v}" aria-pressed="${mine === v}" aria-label="${v} – ${SCORE_WORDS[v]}"><b>${v}</b><span>${SCORE_WORDS[v]}</span></button>`).join("");
    return `
      <div class="rate">
        <span class="row-label">${state.me ? "Your rating" : "Rate it (pick your name first)"}</span>
        <div class="rate-btns" role="group" aria-label="Your rating for ${esc(p.name)}">${btns}</div>
