        <p class="rate-legend">1 skip it · 3 sure · 5 love it</p>
        ${topBtnHTML(p)}
      </div>
      <div class="group-col">
        ${groupHeadHTML(stats(p))}
        ${votesListHTML(p)}
      </div>`;
  }

  const STAR_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>`;
  function topBtnHTML(p) {
    const on = myTop().includes(p.id);
    const full = !on && myTop().length >= TOP_MAX;
    return `<button type="button" class="top-btn${full ? " full" : ""}" data-top aria-pressed="${on}"
      title="${on ? "In your Top 5. Tap to remove it." : full ? "You've picked all 5. Remove one first." : "Must go: add it to your Top 5"}">${STAR_SVG}${on ? "In my Top 5" : "Add to my Top 5"}</button>`;
  }
  const topStar = (v) => `<span class="top-star" title="In ${esc(v.name)}'s Top 5" aria-label="Top 5">★</span>`;

  function cardHTML(p) {
    const blurb = p.blurb || (p.notes.length ? "" : p.category ? `${p.category}.` : "");
    return `
      <article class="spot" id="spot-${esc(p.id)}" data-id="${esc(p.id)}">
        ${thumbHTML(p, "thumb")}
        <div class="info">
          <div class="name-row"><h3>${esc(p.name)}</h3><span class="badges">${badgesHTML(p)}</span></div>
          ${metaHTML(p, state.list === "all" && state.sort !== "list")}
          ${blurb ? `<p class="blurb">${esc(blurb)}</p>` : ""}
          ${p.notes.filter((n) => !/^reservation/i.test(n)).map((n) => `<p class="note">${esc(n)}</p>`).join("")}
          ${scheduledHTML(p)}
          <div class="links">
            <a href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">Map ↗</a>
            ${p.website ? `<a href="${esc(p.website)}" target="_blank" rel="noopener">Website ↗</a>` : ""}
          </div>
        </div>
        <div class="scores">${scoresHTML(p)}</div>
      </article>`;
  }

  function progressText() {
    const rated = places().filter((p) => myScore(p.id)).length;
    return `You've rated <b>${rated}</b> of ${places().length} · <span class="top-star" style="margin:0">★</span> Top 5: <b>${myTop().length}</b> of ${TOP_MAX}`;
  }

  function renderSpots() {
    const all = places();
    const rated = all.filter((p) => myScore(p.id)).length;
    let shown = all.filter(inList);
    if (state.unratedOnly) shown = shown.filter((p) => !myScore(p.id));
    const progress = state.me
      ? `<div class="progress" id="progress"><span>${progressText()}</span><div class="track"><div class="fill" style="width:${(rated / all.length) * 100}%"></div></div></div>`
      : `<p class="intro">Tap <b>${state.voters.length ? "Pick your name" : "Join"}</b> at the top to start rating. Scores: 1 skip it · 2 meh · 3 sure · 4 want to · 5 love it. Pick up to ${TOP_MAX} must-gos for your Top 5.</p>`;

    if (!shown.length) {
      return progress + `<div class="empty-note">${state.unratedOnly ? "You've rated everything here. Nice." : "Nothing in this list yet."}</div>`;
    }
    if (state.sort === "list") {
      const lists = state.list === "all" ? state.board.lists.map((l) => l.name) : [state.list];
      return progress + lists.map((name) => {
        const items = shown.filter((p) => p.lists[0] === name || (state.list !== "all" && p.lists.includes(name)));
        if (!items.length) return "";
        return `<h2 class="list-head"><span class="dot" style="background:${esc(listColor(name))}"></span>${esc(name)} <span class="n">${items.length}</span></h2>
          <div class="cards">${items.map(cardHTML).join("")}</div>`;
      }).join("");
    }
    const sorted = [...shown].sort(state.sort === "group" ? byGroup : (a, b) => {
      const na = need(a)?.level || 0, nb = need(b)?.level || 0;
      return nb - na || byGroup(a, b);
    });
    return progress + `<div class="cards">${sorted.map(cardHTML).join("")}</div>`;
  }

  // On vote updates, refresh each card's scores in place so the list doesn't jump while you rate.
  function refreshSpots() {
    const byId = new Map(places().map((p) => [p.id, p]));
    document.querySelectorAll("#main .spot").forEach((card) => {
      const p = byId.get(card.dataset.id);
      if (!p) return;
      $(".scores", card).innerHTML = scoresHTML(p);
      $(".badges", card).innerHTML = badgesHTML(p);
    });
    const prog = $("#progress");
    if (prog && state.me) {
      const rated = places().filter((p) => myScore(p.id)).length;
      $("span", prog).innerHTML = progressText();
      $(".fill", prog).style.width = `${(rated / places().length) * 100}%`;
    } else if (!!prog !== !!state.me) {
      render();
    }
  }

  /* ---------- View: group picks ---------- */

  function votedHTML() {
    const total = places().length;
    if (!state.voters.length) return "";
    return `<ul class="voted">${orderedVoters().map((v) => {
      const n = places().filter((p) => v.scores[p.id]).length;
      return `<li class="${n === total ? "done" : ""}">${esc(v.name)} · ${n === total ? "✓ all rated" : `${n}/${total}`}</li>`;
    }).join("")}</ul>`;
  }

  function renderPicks() {
    const shown = places().filter(inList).sort(byGroup);
    if (!state.voters.length) return `<div class="empty-note">No votes yet. Once people rate spots or pick their Top 5, they're ranked here.</div>`;
    let rank = 0;
    const sections = TIER_ORDER.map((key) => {
      const items = shown.filter((p) => stats(p).tier === key);
      if (!items.length) return "";
      return `<section class="tier-sec">
        <div class="tier-head"><h2>${TIERS[key].name}</h2><span class="n">${items.length}</span><p>${esc(TIERS[key].hint)}</p></div>
        <div class="picks">${items.map((p) => {
          const s = stats(p);
          rank++;
          return `<div class="pick">
            <span class="rank">${key === "wait" ? "" : rank}</span>
            ${thumbHTML(p, "pthumb")}
            <div class="pinfo">
              <button class="pname" type="button" data-goto="${esc(p.id)}">${esc(p.name)}</button>
              ${metaHTML(p, state.list === "all")}
              ${s.tops ? `<p class="meta top-line"><span class="top-star">★</span>In ${esc(s.topBy.map((v) => v.name).join(", "))}'s Top 5</p>` : ""}
              ${peopleHTML(p)}
            </div>
            <div class="pscore">
              ${s.count ? `<span class="avg"><b>${s.avg.toFixed(1)}</b></span>` : ""}
              <small>${s.count} of ${s.n} voted${s.split ? " · split" : ""}</small>
              <span class="badges">${badgesHTML(p)}</span>
            </div>
          </div>`;
        }).join("")}</div>
      </section>`;
    }).join("");
    return `<p class="intro">Anything in someone's Top 5 is a Must go. Everything else is ranked by everyone's 1–5 scores; ties go to the spot with more 5s.</p>${votedHTML()}${sections}`;
  }

  /* ---------- View: reservations ---------- */

  function bookRowHTML(p) {
    const n = need(p), s = stats(p), booked = isBooked(p), info = state.spots[p.id] || {};
    const details = [];
    if (n) details.push(`Weekdays ${n.wd}/5 · Weekends ${n.we}/5`);
    details.push(s.count ? `Group ${s.avg.toFixed(1)} · ${TIERS[s.tier].name}` : "No votes yet");
    const links = [`<a href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">Map ↗</a>`];
    if (p.website) links.unshift(`<a href="${esc(p.website)}" target="_blank" rel="noopener">Website / book ↗</a>`);
    if (p.phone) links.push(`<a href="tel:${esc(p.phone.replace(/[^+\d]/g, ""))}">Call ${esc(p.phone)}</a>`);
    return `<div class="bk${booked ? " is-booked" : ""}" data-id="${esc(p.id)}">
      <div class="bk-main">
        <div class="name-row"><h3>${esc(p.name)}</h3>${n && !booked ? `<span class="badge ${n.cls}">${n.label}</span>` : ""}</div>
        <p class="meta">${esc(p.lists.join(", "))} · ${details.join(" · ")}</p>
        ${scheduledHTML(p)}
        <div class="links">${links.join("")}</div>
      </div>
      <label class="bk-check"><input type="checkbox" data-booked ${booked ? "checked" : ""}> ${booked ? "Booked" : "Mark booked"}</label>
      <input class="bk-note" data-note maxlength="200" value="${esc(info.note || "")}" placeholder="Booking details, e.g. Sat 8:30 PM · 4 people · OpenTable" aria-label="Booking details for ${esc(p.name)}">
      ${info.by && info.updatedAt ? `<p class="bk-by">Updated by ${esc(info.by)}</p>` : ""}
    </div>`;
  }

  function renderBook() {
    const shown = places().filter(inList);
    const needs = (p) => (need(p)?.level || 0) >= 3;
    const wanted = (p) => WANTED.includes(stats(p).tier);
    const order = (a, b) => (need(b)?.level || 0) - (need(a)?.level || 0) || byGroup(a, b);
    const booked = shown.filter(isBooked).sort(byGroup);
    const open = shown.filter(toBook);
    const first = open.filter(wanted).sort(order);
    const undecided = open.filter((p) => stats(p).tier === "wait").sort(order);
    const later = open.filter((p) => !wanted(p) && stats(p).tier !== "wait").sort(order);
    const walkins = shown.filter((p) => !isBooked(p) && !needs(p)).sort((a, b) => a.name.localeCompare(b.name));
    const sec = (title, note, items) => (items.length ? `<section class="book-sec"><h2>${title} <span class="n">${items.length}</span></h2><p>${note}</p>${items.map(bookRowHTML).join("")}</section>` : "");
    const togo = daysToGo();
    return `<p class="intro">${togo ? `<b>${esc(togo)}.</b> ` : ""}Booking levels are Wanderlog's estimates for ${esc(state.months.map((m) => new Date(2000, m, 1).toLocaleDateString("en-US", { month: "long" })).join(" and "))}. Mark spots booked and add details so everyone can see them.</p>
      ${sec("Book these first", "In someone's Top 5 or the group wants to go, and Wanderlog says to reserve.", first)}
      ${sec("Waiting on votes", "These need a reservation, but not enough people have rated them yet.", undecided)}
      ${sec("Booked", "Marked as booked by the group, or a reservation is on the Wanderlog itinerary.", booked)}
      ${sec("Lower priority", "These need a reservation, but the group is lukewarm.", later)}
      ${walkins.length ? `<details class="walkins"><summary>Walk-in spots · ${walkins.length}</summary><p>${walkins.map((p) => esc(p.name)).join(" · ")}</p></details>` : ""}
      ${!first.length && !undecided.length && !booked.length && !later.length ? `<div class="empty-note">Nothing here needs a reservation.</div>` : ""}`;
  }

  /* ---------- View: itinerary ---------- */

  function itineraryItemHTML(it, byId) {
    if (!it.placeId) {
      return it.note ? `<li><span class="it-time">${it.time ? esc(fmtTime(it.time)) : ""}</span><div class="it-card note-card"><p style="margin:0">${esc(it.note)}</p></div></li>` : "";
    }
    const p = byId.get(it.placeId);
    if (!p) return "";
    const s = stats(p);
    const time = it.time ? fmtTime(it.time) + (it.endTime ? `–${fmtTime(it.endTime)}` : "") : "";
    return `<li>
      <span class="it-time">${esc(time)}</span>
      <div class="it-card" data-id="${esc(p.id)}">
        ${thumbHTML(p, "pthumb")}
        <div class="it-info">
          <button class="pname" type="button" data-goto="${esc(p.id)}">${esc(p.name)}</button>
          ${metaHTML(p, false)}
          ${badgesHTML(p) ? `<span class="badges">${badgesHTML(p)}</span>` : ""}
          ${it.note ? `<p class="note">${esc(it.note)}</p>` : ""}
        </div>
        <div class="it-score">
          ${s.count ? `<span class="avg"><b>${s.avg.toFixed(1)}</b><small>avg</small></span>` : ""}
          ${tierHTML(s)}
        </div>
      </div>
    </li>`;
  }

  // Every day of the trip (empty ones too), with Wanderlog's planned places in order.
  function renderItinerary() {
    const b = state.board;
    const byDate = new Map((b.itinerary || []).map((d) => [d.date, d]));
    const dates = [];
    if (b.startDate && b.endDate) {
      for (const d = day(b.startDate); d <= day(b.endDate) && dates.length < 90; d.setDate(d.getDate() + 1)) dates.push(isoDay(d));
    }
    for (const d of byDate.keys()) if (!dates.includes(d)) dates.push(d);
    dates.sort();
    if (!dates.length) return `<div class="empty-note">Wanderlog doesn't have a day-by-day plan for this trip yet. Add places to days in Wanderlog's itinerary and they'll show up here.</div>`;
    const byId = new Map(places().map((p) => [p.id, p]));
    const planned = [...byDate.values()].reduce((n, d) => n + d.items.filter((it) => it.placeId && byId.has(it.placeId)).length, 0);
    const today = isoDay(new Date());
    return `<p class="intro">Wanderlog's day-by-day plan: ${planned} place${planned === 1 ? "" : "s"} across ${dates.length} day${dates.length === 1 ? "" : "s"}. Plan days in Wanderlog; they show up here after the next refresh.</p>
      <div class="days">${dates.map((date) => {
        const d = byDate.get(date);
        const items = (d?.items || []).map((it) => itineraryItemHTML(it, byId)).join("");
        const n = b.startDate ? Math.round((day(date) - day(b.startDate)) / 864e5) + 1 : 0;
        return `<section class="day" aria-label="${esc(fmtDay(date, { weekday: "long", month: "long", day: "numeric" }))}">
          <div class="day-head">
            ${n >= 1 ? `<span class="day-num">Day ${n}</span>` : ""}
            <h2>${esc(fmtDay(date, { weekday: "long", month: "short", day: "numeric" }))}</h2>
            ${date === today ? `<span class="badge booked-b">Today</span>` : ""}
            ${d?.title ? `<p class="day-title">${esc(d.title)}</p>` : ""}
          </div>
          ${d?.note ? `<p class="day-note">${esc(d.note)}</p>` : ""}
          ${items ? `<ol class="day-list">${items}</ol>` : `<p class="day-empty">Nothing planned yet</p>`}
        </section>`;
      }).join("")}</div>`;
  }

  /* ---------- View: map ---------- */

  const isDark = () => (document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function renderMapView() {
    const legend = TIER_ORDER.map((t) => `<li><span class="dot${t === "wait" ? " wait" : ""}"${t === "wait" ? "" : ` style="background:var(--v-${t})"`}></span>${TIERS[t].name}</li>`).join("");
    return `<div class="map-wrap">
      <div class="map" id="map" role="region" aria-label="Map of the trip's places"></div>
      <ul class="map-legend" aria-label="Pin colors show the group's verdict">${legend}</ul>
      <p class="side-note" id="mapNote"></p>
    </div>`;
  }

  function popupHTML(p) {
    const s = stats(p);
    return `<div class="pop">
      ${p.image ? `<img class="pop-img" src="${esc(p.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <h3>${esc(p.name)}</h3>
      ${metaHTML(p, true)}
      ${badgesHTML(p) ? `<div class="badges">${badgesHTML(p)}</div>` : ""}
      ${groupHeadHTML(s)}
      ${votesListHTML(p)}
      <div class="links"><button type="button" data-goto="${esc(p.id)}">See details & rate</button><a href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">Google Maps ↗</a></div>
    </div>`;
  }

  function initMap() {
    const el = $("#map");
    if (!el) return;
    if (!window.L) { el.innerHTML = `<div class="empty-note">The map couldn't load. Check your connection and reload.</div>`; return; }
    const map = L.map(el, { zoomControl: true, scrollWheelZoom: true });
    // OpenStreetMap's own tiles: free, no key. Toned down (and inverted in dark mode) so the pins stand out.
    el.classList.toggle("dark-tiles", isDark());
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
    state.map = { map, layer: L.layerGroup().addTo(map), markers: new Map(), openId: null };
    map.on("popupopen", (e) => { state.map.openId = e.popup._source?.options.placeId || null; });
    map.on("popupclose", () => { if (state.map) state.map.openId = null; });
    refreshMap(true);
  }

  // Pins colored by the group's verdict; "Definitely go" pins are bigger and drawn on top.
  function refreshMap(fit) {
    if (!state.map) return;
    const { map, layer } = state.map;
    const reopen = state.map.openId;
    layer.clearLayers();
    state.map.markers.clear();
    const shown = places().filter(inList);
    const pts = shown.filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lng));
    // Pins get a ring that contrasts with the map: the page surface on light tiles, light ink on dark ones.
    const surface = cssVar("--surface"), muted = cssVar("--muted"), ring = isDark() ? cssVar("--ink") : surface;
    const ordered = [...pts].sort((a, b) => TIER_ORDER.indexOf(stats(b).tier) - TIER_ORDER.indexOf(stats(a).tier));
    for (const p of ordered) {
      const t = stats(p).tier;
      const marker = L.circleMarker([p.lat, p.lng], t === "wait"
        ? { placeId: p.id, radius: 7, color: muted, weight: 1.5, dashArray: "3 3", fillColor: surface, fillOpacity: 1 }
        : { placeId: p.id, radius: t === "must" ? 11 : t === "def" ? 9.5 : 8, color: ring, weight: isDark() ? 1.5 : 2, fillColor: cssVar(`--v-${t}`), fillOpacity: 1 });
      marker.bindPopup(() => popupHTML(p), { maxWidth: 280, minWidth: 250 });
      marker.bindTooltip(p.name, { direction: "top", offset: [0, -8] });
      layer.addLayer(marker);
      state.map.markers.set(p.id, marker);
    }
    if (reopen && state.map.markers.has(reopen)) state.map.markers.get(reopen).openPopup();
    const note = $("#mapNote");
    if (note) note.textContent = `${pts.length} of ${places().length} places shown${shown.length < places().length ? " (filters apply)" : ""}. Tap a pin for details.`;
    if (fit) {
      if (pts.length) map.fitBounds(L.latLngBounds(pts.map((p) => [p.lat, p.lng])), { padding: [30, 30], maxZoom: 15 });
      else map.setView([20, 0], 2);
    }
  }
  function destroyMap() {
    if (state.map) { state.map.map.remove(); state.map = null; }
  }

  /* ---------- Summary side panel (whole-trip totals; ignores the filters) ---------- */

  function renderSide() {
    if (!state.board) { $("#side").innerHTML = ""; return; }
    const all = places();
    const st = new Map(all.map((p) => [p.id, stats(p)]));
    const isGo = (p) => GOING.includes(st.get(p.id).tier);
    const goCount = all.filter(isGo).length;
    const mustCount = all.filter((p) => st.get(p.id).tier === "must").length;
    const bookCount = all.filter(toBook).length;
    const wantedToBook = all.filter((p) => toBook(p) && WANTED.includes(st.get(p.id).tier)).length;
    const bookedCount = all.filter(isBooked).length;

    const kinds = Object.keys(KINDS)
      .map((k) => {
        const items = all.filter((p) => (p.kind || "other") === k);
        return { k, n: items.length, go: items.filter(isGo).length, book: items.filter(toBook).length };
      })
      .filter((r) => r.n)
      .sort((a, b) => b.n - a.n);
    const maxN = Math.max(1, ...kinds.map((r) => r.n));
    const num = (n) => `<td class="num${n ? "" : " zero"}">${n}</td>`;
    const rows = kinds.map((r) => `
      <tr aria-selected="${state.kind === r.k}">
        <th scope="row"><button type="button" class="kind-btn" data-kind="${r.k}" aria-pressed="${state.kind === r.k}">${esc(KINDS[r.k])}</button>
          <span class="kbar" aria-hidden="true"><span style="width:${(r.n / maxN) * 100}%"></span></span></th>
        ${num(r.n)}${num(r.go)}${num(r.book)}
      </tr>`).join("");

    const tiers = TIER_ORDER.map((t) => ({ t, n: all.filter((p) => st.get(p.id).tier === t).length }));
    const stack = tiers.filter((x) => x.n).map((x) =>
      `<span style="flex:${x.n};background:var(--v-${x.t})" title="${esc(TIERS[x.t].name)}: ${x.n}"></span>`).join("");
    const legend = tiers.map((x) => `<li><span class="sw sw-${x.t}"></span>${TIERS[x.t].name}<b>${x.n}</b></li>`).join("");

    const meters = orderedVoters().map((v) => {
      const n = all.filter((p) => v.scores[p.id]).length;
      const remove = state.isPlanner
        ? `<button class="remove-btn" type="button" data-remove-voter="${esc(v.id)}" title="Remove ${esc(v.name)} and their votes" aria-label="Remove ${esc(v.name)} and their votes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>`
        : "<span></span>";
      return `<li><span class="nm" title="${esc(v.name)}">${esc(v.name)}</span><span class="meter" role="img" aria-label="${esc(v.name)} rated ${n} of ${all.length}"><span style="width:${(n / all.length) * 100}%"></span></span><b>${n}/${all.length}</b><span class="tops" title="${esc(v.name)} has picked ${v.top.length} of ${TOP_MAX} Top 5 places"><span class="top-star" style="margin:0">★</span>${v.top.length}/${TOP_MAX}</span>${remove}</li>`;
    }).join("");

    $("#side").innerHTML = `
      <div class="side-head"><h2>Summary</h2>
        <button class="icon-btn side-close" id="sideClose" type="button" aria-label="Close summary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="side-sub">Totals for the whole trip</p>
      <div class="kpis">
        <div class="kpi"><span class="kpi-l">Spots</span><b>${all.length}</b></div>
        <div class="kpi"><span class="kpi-l">Must go</span><b>${mustCount}</b><small>in someone's Top 5</small></div>
        <div class="kpi"><span class="kpi-l">Definitely go</span><b>${goCount - mustCount}</b><small>the group agrees</small></div>
        <div class="kpi"><span class="kpi-l">Still to book</span><b>${bookCount}</b><small>${wantedToBook} the group wants · ${bookedCount} booked</small></div>
      </div>
      <section class="side-sec">
        <h3>By type</h3>
        <table class="kinds">
          <thead><tr><th scope="col">Type</th><th scope="col" class="num">Spots</th><th scope="col" class="num" title="Must go (someone's Top 5) or definitely go">Go</th><th scope="col" class="num" title="Needs a reservation and nobody has booked it yet">Book</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><th scope="row">Total</th>${num(all.length)}${num(goCount)}${num(bookCount)}</tr></tfoot>
        </table>
        <p class="side-note">Go = must go or definitely go · Book = still needs a reservation. Tap a type to filter the list.</p>
      </section>
      <section class="side-sec">
        <h3>Group verdict</h3>
        ${stack ? `<div class="stack" role="img" aria-label="${esc(tiers.map((x) => `${TIERS[x.t].name} ${x.n}`).join(", "))}">${stack}</div>` : ""}
        <ul class="legend">${legend}</ul>
      </section>
      <section class="side-sec">
        <h3>Votes in · ${state.voters.length} ${state.voters.length === 1 ? "person" : "people"}</h3>
        ${meters ? `<ul class="meters">${meters}</ul>` : `<p class="side-note">Nobody has joined yet.</p>`}
      </section>`;
  }

  function setDrawer(open) {
    const side = $("#side");
    side.classList.toggle("open", open);
    $("#scrim").hidden = !open;
    $("#dashBtn").setAttribute("aria-expanded", String(open));
    document.body.style.overflow = open ? "hidden" : "";
    if (open) $("#sideClose")?.focus();
  }
  const drawerMode = () => matchMedia("(max-width: 1099px)").matches;

  /* ---------- Rendering ---------- */

  // The hero: destination photo, title, and the trip details line (dates, countdown, spots, last Wanderlog refresh).
  function renderHeader() {
    const plan = state.plan;
    if (!plan) return;
    const hero = $("#hero");
    hero.style.backgroundImage = plan.hero ? `url("${plan.hero.replace(/"/g, "%22")}")` : "";
    $("#heroCredit").hidden = !plan.hero;
    $("#tripPlace").textContent = plan.destination || "POI Planner";
    $("#tripTitle").textContent = plan.title || NEW_TRIP;
    document.title = `${plan.title || NEW_TRIP} · POI Planner`;
    const sync = plan.status === "pending"
      ? `${plan.places ? "Refreshing" : "Importing"} from Wanderlog…`
      : plan.status === "error" ? "Couldn't refresh from Wanderlog"
      : plan.syncedAt ? `Refreshed from Wanderlog ${ago(plan.syncedAt)}` : "";
    const bits = [fmtRange(plan.startDate, plan.endDate), daysToGo(), state.board ? `${places().length} spots` : "", sync].filter(Boolean).map(esc);
    $("#tripSub").innerHTML = bits.join(" · ")
      + (state.isPlanner && plan.status !== "pending" ? ` · <button class="link-btn" type="button" id="refreshBtn">Refresh now</button>` : "");
    $("#backLink").hidden = !state.isPlanner;
    const who = $("#whoBtn");
    const me = myVoter() || state.me;
    who.hidden = !state.board;
    who.classList.toggle("empty", !me);
    who.innerHTML = me ? `<span class="lbl">Voting as</span> <b>${esc(me.name)}</b>` : "Pick your name";
    $("#foot").textContent = "Places come from the group's Wanderlog trip.";
  }
  setInterval(() => { if (state.tripId && state.plan) renderHeader(); }, 60_000);
  $("#tripSub").addEventListener("click", async (e) => {
    if (!e.target.closest("#refreshBtn")) return;
    try { await requestRefresh(state.tripId, state.plan?.title); } catch (err) { console.error(err); toast("Couldn't ask for a refresh."); }
  });

  function renderChips() {
    const all = places();
    const chips = [{ name: "all", label: "All", n: all.length }, ...state.board.lists.map((l) => ({ name: l.name, label: l.name, n: all.filter((p) => p.lists.includes(l.name)).length }))];
    const kindChip = state.kind
      ? `<button type="button" class="chip-btn kind-chip" data-clear-kind aria-label="Clear the ${esc(KINDS[state.kind])} filter">${esc(KINDS[state.kind])} ✕</button>`
      : "";
    $("#listChips").innerHTML = kindChip + chips.map((c) => `<button type="button" class="chip-btn" data-list="${esc(c.name)}" aria-pressed="${state.list === c.name}">${esc(c.label)}<span class="n">${c.n}</span></button>`).join("");
  }

  function render() {
    state.pendingRender = false;
    destroyMap();
    const ready = !!state.board;
    $(".bar").hidden = !ready;
    $("#side").hidden = !ready;
    if (!ready) {
      const p = state.plan || {};
      $("#main").innerHTML = p.status === "error"
        ? `<div class="empty-note">Couldn't import this trip from Wanderlog: ${esc(p.error || "unknown error")}. Check the Wanderlog link is shared${state.isPlanner ? ", then use Refresh now above" : ""}.</div>`
        : `<div class="empty-note">Importing places from Wanderlog… This usually takes 10–20 minutes. The page updates by itself.</div>`;
      return;
    }
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.view === state.view)));
    $("#spotTools").hidden = state.view !== "spots";
    $(".filters").hidden = state.view === "days";
    $("#sortSel").value = state.sort;
    $("#unratedOnly").checked = state.unratedOnly;
    renderChips();
    renderSide();
    $("#main").innerHTML = state.view === "picks" ? renderPicks() : state.view === "book" ? renderBook()
      : state.view === "days" ? renderItinerary() : state.view === "map" ? renderMapView() : renderSpots();
    if (state.view === "map") initMap();
  }

  // Data changed: patch in place where we can (cards, map pins) so nothing jumps; never re-render under someone typing.
  function scheduleRender() {
    if (!state.board) return;
    renderSide();
    if (state.view === "spots" && document.querySelector("#main .spot")) return refreshSpots();
    if (state.view === "map" && state.map) return refreshMap(false);
    if (document.activeElement?.matches?.("[data-note]")) { state.pendingRender = true; return; }
    render();
  }

  function goToSpot(id) {
    state.view = "spots";
    state.sort = "list";
    state.unratedOnly = false;
    const target = places().find((p) => p.id === id);
    if (state.list !== "all" && !target?.lists.includes(state.list)) state.list = "all";
    if (state.kind && (target?.kind || "other") !== state.kind) state.kind = null;
    render();
    const card = document.getElementById(`spot-${id}`);
    if (card) {
      card.scrollIntoView({ behavior: "smooth", block: "start" });
      card.classList.add("flash");
      setTimeout(() => card.classList.remove("flash"), 1500);
    }
  }

  /* ---------- Who's voting ---------- */

  function slugify(name) {
    return name.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
  }
  function chooseVoter(v) {
    state.me = { id: v.id, name: v.name };
    lsSet(`tripRanker.me.${state.tripId}`, JSON.stringify(state.me));
    $("#whoDlg").close();
    renderHeader();
    render();
  }
  function openWho(hint) {
    const dlg = $("#whoDlg");
    $("#whoHint").textContent = hint || "Pick your name. Your scores are saved under it, so you can open this link on any device and pick up where you left off.";
    $("#whoNames").innerHTML = orderedVoters().map((v) => `<button type="button" data-voter="${esc(v.id)}">${esc(v.name)}</button>`).join("");
    const first = (state.user?.displayName || "").split(" ")[0];
    $("#whoInput").value = first && !state.voters.some((v) => v.id === slugify(first)) ? first : "";
    if (!dlg.open) dlg.showModal();
  }
  $("#whoNames").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-voter]");
    const v = btn && state.voters.find((x) => x.id === btn.dataset.voter);
    if (v) chooseVoter(v);
  });
  $("#whoForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("#whoInput").value.trim().replace(/\s+/g, " ").slice(0, 30);
    if (!name || !state.tripId) return;
    const id = slugify(name) || `voter-${Math.random().toString(36).slice(2, 8)}`;
    const existing = state.voters.find((v) => v.id === id);
    if (existing) return chooseVoter(existing);
    try {
      await votersRef().doc(id).set({ name, scores: {}, updatedAt: FV().serverTimestamp() }, { merge: true });
      chooseVoter({ id, name });
    } catch (err) { dbError(err); $("#whoDlg").close(); }
  });
  $("#whoLater").addEventListener("click", () => $("#whoDlg").close());
  $("#whoBtn").addEventListener("click", () => openWho());
  $("#shareBtn").addEventListener("click", () => copyLink(state.tripId, state.plan?.title));

  /* ---------- Events ---------- */

  document.querySelector(".tabs").addEventListener("click", (e) => {
    const t = e.target.closest("[data-view]");
    if (!t || t.dataset.view === state.view) return;
    state.view = t.dataset.view;
    render();
    $(".bar").scrollIntoView({ block: "start" });
  });
  $("#listChips").addEventListener("click", (e) => {
    if (e.target.closest("[data-clear-kind]")) { state.kind = null; return render(); }
    const c = e.target.closest("[data-list]");
    if (!c) return;
    state.list = c.dataset.list;
    render();
  });

  $("#side").addEventListener("click", (e) => {
    if (e.target.closest("#sideClose")) return setDrawer(false);
    const rm = e.target.closest("[data-remove-voter]");
    if (rm) return removeVoter(rm.dataset.removeVoter);
    const k = e.target.closest("[data-kind]");
    if (!k) return;
    state.kind = state.kind === k.dataset.kind ? null : k.dataset.kind;
    render();
    if (drawerMode() && state.kind) setDrawer(false);
  });
  $("#dashBtn").addEventListener("click", () => setDrawer(true));
  $("#scrim").addEventListener("click", () => setDrawer(false));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("#side").classList.contains("open")) setDrawer(false);
  });
  matchMedia("(max-width: 1099px)").addEventListener("change", (e) => { if (!e.matches) setDrawer(false); });
  $("#sortSel").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
  $("#unratedOnly").addEventListener("change", (e) => { state.unratedOnly = e.target.checked; render(); });

  $("#main").addEventListener("click", (e) => {
    const rate = e.target.closest("[data-rate]");
    if (rate) return setScore(rate.closest("[data-id]").dataset.id, Number(rate.dataset.rate));
    const top = e.target.closest("[data-top]");
    if (top) return toggleTop(top.closest("[data-id]").dataset.id);
    const go = e.target.closest("[data-goto]");
    if (go) return goToSpot(go.dataset.goto);
  });
  $("#main").addEventListener("change", (e) => {
    const row = e.target.closest("[data-id]");
    if (!row) return;
    if (e.target.matches("[data-booked]")) saveSpot(row.dataset.id, { booked: e.target.checked });
    if (e.target.matches("[data-note]")) saveSpot(row.dataset.id, { note: e.target.value.trim().slice(0, 200) });
  });
  $("#main").addEventListener("focusout", (e) => {
    if (e.target.matches("[data-note]") && state.pendingRender) setTimeout(() => { if (!document.activeElement?.matches?.("[data-note]")) render(); }, 0);
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".theme-btn")) return;
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    lsSet("theme", next);
    if (state.view === "map" && state.map) render(); // switch map tiles
  });
})();
</script>
</body>
</html>
